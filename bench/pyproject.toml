[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bench"
version = "1.0.1"
description = "Bayesian Estimation of Change"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  {name = "Hossein Rafipoor"},
  {name = "Michiel Cottaar"},
  {name = "Saad Jbabdi"},
]

dependencies = ["joblib", "dipy", "numba", "numpy", "setuptools", "pytest", "tqdm",
"seaborn", "matplotlib", "scipy", "dill", "fslpy", "file-tree-fsl"]

[project.urls]
Homepage = "https://git.fmrib.ox.ac.uk/hossein/bench.git"

[project.scripts]
bench = "bench.main:main"

[tool.setuptools.packages.find]
include = ["bench", "bench.*"]

[tool.setuptools.package-data]
"bench.trees" = ["*.txt"]

[tool.setuptools]
include-package-data = true
